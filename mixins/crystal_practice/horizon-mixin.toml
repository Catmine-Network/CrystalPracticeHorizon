[mod]
id = "crystal_practice"
version = "0.1.0"
priority = 100

# The commit it was tested on. It uses only the native hook points (hooks in
# compatibility.json): the launcher builds it on any Horizon that has them.
[compatibility]
horizon_revision = "9f42064c11efe7ef3e5ed2baad7ddc2a3b36eea0"

# The logic and its tests (also the Cargo library).
[[module]]
id = "runtime"
file = "crates/horizon-client/src/game.rs"
name = "crystal_practice"
source = "runtime.rs"

# The game-facing glue.
[[module]]
id = "glue"
file = "crates/horizon-client/src/game.rs"
name = "crystal_practice_glue"
source = "glue.rs"

# The mod's row in Options > Mods.
[[injection]]
id = "list"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_mods"
helper = "list.rs"
bindings = [
  { name = "mods", ty = "&mut Vec<crate::game::native_hooks::NativeMod>", value = "&mut *mods" },
]

# The HUD, every frame.
[[injection]]
id = "hud"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_hud"
helper = "hud.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "batch", ty = "&mut horizon_client::hud::HudBatch", value = "&mut *batch" },
  { name = "corners", ty = "&mut horizon_client::extras_hud::Corners", value = "&mut *corners" },
]

# /cp in the command tree.
[[injection]]
id = "register"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_register_commands"
helper = "register.rs"
bindings = [
  { name = "commands", ty = "&mut Vec<crate::game::native_server::NativeCommand>", value = "&mut *commands" },
]

# Running /cp.
[[injection]]
id = "command"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_perform_command"
helper = "command.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "player", ty = "&crate::game::native_server::NativeServerPlayer", value = "player" },
  { name = "command", ty = "&str", value = "command" },
  { name = "ran", ty = "&mut bool", value = "&mut *ran" },
]

# The server tick: queued commands, the dummy, challenges.
[[injection]]
id = "tick"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_server_tick"
helper = "tick.rs"
bindings = [
  { name = "game", ty = "&mut crate::game::Game<'_>", value = "&mut *self" },
  { name = "phase", ty = "crate::game::native_lifecycle::ServerTickPhase", value = "phase" },
]

# Hits on the dummy and targets.
[[injection]]
id = "damage"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_living_incoming_damage"
helper = "damage.rs"
bindings = [
  { name = "entity", ty = "i32", value = "entity" },
  { name = "damage_type", ty = "&str", value = "damage_type" },
  { name = "amount", ty = "&mut f32", value = "&mut *amount" },
  { name = "canceled", ty = "&mut bool", value = "&mut *canceled" },
]

# Deaths: the dummy is immortal, targets are counted.
[[injection]]
id = "death"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_living_death"
helper = "death.rs"
bindings = [
  { name = "entity", ty = "u32", value = "entity" },
  { name = "kind", ty = "&str", value = "kind" },
  { name = "cancel", ty = "&mut bool", value = "&mut *cancel" },
]

# The player's totem pops.
[[injection]]
id = "totem"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_player_totem"
helper = "totem.rs"
bindings = [
  { name = "player", ty = "u128", value = "player" },
]

# Which explosion hurts the dummy: a crystal's or an anchor's.
[[injection]]
id = "explosion"
kind = "HEAD"
target = "horizon_client::game::native_hooks::Game<'_>::native_explosion_detonate"
helper = "explosion.rs"
bindings = [
  { name = "source", ty = "Option<(u32, &str)>", value = "source" },
]
